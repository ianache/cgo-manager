                - paragraph [ref=f1e1041]: "Create a \"Checkboxes States Catalog\" screen for the C-GO Aerospace Admin Panel design system. This is a component documentation/catalog page showing ALL operational states of a custom checkbox component. Layout: Full-width catalog page with sidebar navigation (inverse_surface #2e3132) and main content area (surface #f8f9fa). Use Inter font throughout. The catalog must show these checkbox state groups, each in a card (surface_container_lowest #ffffff, cloud-shadow, border-radius 4px, NO 1px borders): **Group 1 – Default / Unchecked** - Unchecked enabled - Unchecked hovered (subtle background fill) - Unchecked focused (primary color outline ring) - Unchecked disabled (opacity 0.38, not-allowed cursor) **Group 2 – Checked** - Checked enabled (primary #bb0012 fill, white checkmark) - Checked hovered (slightly darker fill) - Checked focused (primary outline ring) - Checked disabled (muted fill, opacity 0.38) **Group 3 – Indeterminate** - Indeterminate enabled (primary fill with dash/minus icon) - Indeterminate hovered - Indeterminate focused - Indeterminate disabled **Group 4 – With Labels** - Checkbox + label text (right side) - Checkbox + label + helper/description text below label - Checkbox + label (disabled state) - Checkbox + error state (red label, error message below) **Group 5 – Sizes** - Small (16px) - Medium (20px, default) - Large (24px) **Group 6 – In Context** - Checkbox inside a list item row (like a data table row selector) - \"Select All\" indeterminate parent with children checkboxes - Checkbox inside a form field group Each state must be clearly labeled with its state name in Label-SM style (uppercase, 0.05rem letter-spacing, secondary color #506169). Checkboxes use primary red #bb0012 for active/checked states. Follow the \"No-Line Rule\" — use background shifts not borders. Use the Precision Orbit design system aesthetic."
