<div class="designer-container">
  <cgo-form-header 
    [title]="reportId() ? 'Edit Report' : 'Report Designer'" 
    [description]="reportId() ? 'Modify the configuration of your existing report.' : 'Follow the steps to create a new operational report definition.'">
  </cgo-form-header>

  <div class="designer-stepper cloud-shadow">
    <div class="step" [class.active]="currentStep() === 1" [class.completed]="currentStep() > 1">
      <span class="step-num">{{ currentStep() > 1 ? '✓' : '1' }}</span>
      <span class="step-label">Concept</span>
    </div>
    <div class="step-line"></div>
    <div class="step" [class.active]="currentStep() === 2" [class.completed]="currentStep() > 2">
      <span class="step-num">{{ currentStep() > 2 ? '✓' : '2' }}</span>
      <span class="step-label">Data</span>
    </div>
    <div class="step-line"></div>
    <div class="step" [class.active]="currentStep() === 3">
      <span class="step-num">3</span>
      <span class="step-label">Delivery</span>
    </div>
  </div>

  <main [formGroup]="reportForm" class="designer-main cloud-shadow">
    <!-- Step 1: Concept -->
    <section *ngIf="currentStep() === 1" class="step-content">
      <div class="form-section">
        <label class="label-sm">Report Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Monthly Fuel Usage" class="cgo-input">
      </div>
      <div class="form-section">
        <label class="label-sm">Data Source</label>
        <select formControlName="data_source_id" class="cgo-select">
          <option value="">Select a Source</option>
          <option *ngFor="let ds of dataSources()" [value]="ds.id">{{ds.name}}</option>
        </select>
      </div>
      <div class="form-section">
        <label class="label-sm">Cube Reference</label>
        <input type="text" formControlName="cube_name" placeholder="e.g. SalesModel" class="cgo-input">
      </div>
    </section>

    <!-- Step 2: Data -->
    <section *ngIf="currentStep() === 2" class="step-content">
      <div class="data-selection">
        <div class="selection-column">
          <label class="label-sm">Select Metrics (Measures)</label>
          <div class="checkbox-list">
            <div *ngFor="let m of availableMeasures" class="checkbox-item">
               <input type="checkbox" (change)="toggleSelection(reportForm.value.measures, m)" [checked]="reportForm.value.measures.includes(m)">
               {{m}}
            </div>
          </div>
        </div>

        <div class="selection-column">
          <label class="label-sm">Select Dimensions</label>
          <div class="checkbox-list">
             <div *ngFor="let d of availableDimensions" class="checkbox-item">
               <input type="checkbox" (change)="toggleSelection(reportForm.value.dimensions, d)" [checked]="reportForm.value.dimensions.includes(d)">
               {{d}}
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Step 3: Delivery -->
    <section *ngIf="currentStep() === 3" class="step-content" formGroupName="delivery">
      <div class="form-section">
        <label class="label-sm">Export Format</label>
        <select formControlName="format" class="cgo-select">
            <option value="xlsx">Excel (.xlsx)</option>
            <option value="csv">CSV</option>
            <option value="parquet">Parquet</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-section flex-1">
          <label class="label-sm">Delivery Channel</label>
          <select formControlName="channel" class="cgo-select">
            <option value="email">Email Notification</option>
            <option value="ftp">Secure FTP</option>
            <option value="whatsapp">WhatsApp Business</option>
          </select>
        </div>
        <div class="form-section flex-2">
          <label class="label-sm">Destination</label>
          <input 
            type="text" 
            formControlName="destination" 
            [placeholder]="reportForm.value.delivery?.channel === 'email' ? 'email@example.com' : 'Destination path/number'"
            class="cgo-input">
        </div>
      </div>
    </section>
  </main>

  <footer class="designer-footer">
    <cgo-button 
      variant="secondary" 
      (click)="prevStep()" 
      [disabled]="currentStep() === 1">
      <span class="material-symbols-outlined">arrow_back</span>
      Back
    </cgo-button>
    
    <div class="footer-right">
      <cgo-button 
        *ngIf="currentStep() < 3"
        variant="primary" 
        (click)="nextStep()" 
        [disabled]="currentStep() === 1 && !reportForm.get('name')?.valid">
        Next Step
        <span class="material-symbols-outlined">arrow_forward</span>
      </cgo-button>
      
      <cgo-button 
        *ngIf="currentStep() === 3"
        variant="primary" 
        (click)="saveReport()" 
        [disabled]="!reportForm.valid">
        <span class="material-symbols-outlined">save</span>
        {{ reportId() ? 'Update Report' : 'Finish & Save' }}
      </cgo-button>
    </div>
  </footer>
</div>
