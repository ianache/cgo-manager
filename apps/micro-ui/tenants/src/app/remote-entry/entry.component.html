<div class="page-header">
  <div class="title-section">
    <h2 class="page-title">Tenant Management</h2>
    <p class="page-subtitle">Manage satellite tracking permissions and white-label branding for your clients.</p>
  </div>
  <cgo-button variant="primary">+ ADD NEW TENANT</cgo-button>
</div>

<div class="content-body">
  <cgo-base-table [columns]="columns" [data]="tenants" [showActions]="true">
    <ng-template #statusTemplate let-status>
      <div class="status-cell">
        <span class="status-dot" [class.active]="status === 'Active'"></span>
        {{ status }}
      </div>
    </ng-template>
    
    <ng-template #actionsTemplate let-row>
      <div class="table-actions">
        <cgo-button variant="tertiary">View</cgo-button>
        <cgo-button variant="secondary">Branding</cgo-button>
      </div>
    </ng-template>
  </cgo-base-table>
</div>
