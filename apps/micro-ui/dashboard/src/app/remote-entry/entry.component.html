<div class="dashboard-header">
  <div class="title-section">
    <h2 class="page-title">Mission Control</h2>
    <p class="page-subtitle">Real-time telemetry and platform health overview.</p>
  </div>
</div>

<div class="metrics-grid">
  @for (m of metrics; track m.label) {
    <cgo-kpi-card 
      [label]="m.label" 
      [value]="m.value" 
      [trend]="m.trend"
      [icon]="getIcon(m.label)">
    </cgo-kpi-card>
  }
</div>

<div class="dashboard-body">
  <div class="chart-section">
    <div class="section-header">
      <h3 class="section-title">Vehicle Activity (Last 24h)</h3>
      <span class="label-sm">Updated every 5 mins</span>
    </div>
    <div class="activity-chart">
      <!-- SVG-based Activity Visualization -->
      <svg width="100%" height="200" viewBox="0 0 800 200" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:var(--primary-red);stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:var(--primary-red);stop-opacity:0" />
          </linearGradient>
        </defs>
        <path d="M0,150 Q100,80 200,120 T400,60 T600,140 T800,90 L800,200 L0,200 Z" fill="url(#grad)" />
        <path d="M0,150 Q100,80 200,120 T400,60 T600,140 T800,90" fill="none" stroke="var(--primary-red)" stroke-width="3" />
        <circle cx="400" cy="60" r="6" fill="var(--primary-red)" />
      </svg>
      <div class="chart-labels">
        <span>00:00</span>
        <span>06:00</span>
        <span>12:00</span>
        <span>18:00</span>
        <span>23:59</span>
      </div>
    </div>
  </div>

  <div class="logs-section">
    <div class="section-header">
      <h3 class="section-title">Recent System Logs</h3>
    </div>
    <cgo-table [columns]="logColumns" [data]="recentLogs"></cgo-table>
  </div>
</div>
