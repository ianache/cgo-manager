<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content cloud-shadow" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Sign Out</h3>
      <button class="btn-close" (click)="close.emit()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="logout-icon">
        <span class="material-symbols-outlined">logout</span>
      </div>
      <p class="confirm-text">Are you sure you want to log out?</p>
      <p class="sub-text">You will need to sign in again to access the C-GO ecosystem.</p>
    </div>

    <div class="modal-footer">
      <cgo-button variant="secondary" (click)="close.emit()">Cancel</cgo-button>
      <cgo-button variant="primary" (click)="confirm()">Confirm Logout</cgo-button>
    </div>
  </div>
</div>
